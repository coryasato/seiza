[package]
name = "seiza-tall-table"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A GPUI table that reads rows a page at a time from a delegate, smooth from a hundred rows to tens of millions."

[dependencies]
gpui-kit.workspace = true

[dev-dependencies]
# The fixtures' tests: GPUI's test app and clock, the JSON fixtures, a page
# read's answer. Never in a build.
gpui-kit = { workspace = true, features = ["test-support"] }
futures = "0.3"
serde_json.workspace = true
# `format`'s check that IBM Plex Sans shapes the characters a format writes
# at their advances' sum, with the shaper the web's text system runs
# (gpui-pre-wgpu's `CosmicTextSystem`, at its locked version).
cosmic-text = "=0.19.0"

# Each off by default: a host pays only for what it turns on (PLAN.md).
[features]
# A page's paint for a cell: a fill, a bar, a text color (`CellPaint`).
custom-cells = []
# Rows a host says changed are read again and redrawn in place
# (`TallTableState::invalidate_rows`, `TallTableEvent::Refreshed`).
live = []
# The view follows the tail as `set_rows` grows the rows, until the reader
# scrolls up (`TallTableState::follow`, `TallTableEvent::Following`,
# `TallTableEvent::TailDrawn`). A grown tail page is kept by `live`.
follow = ["live"]
# A column's width dragged at its header edge, and fitted by a double-click
# (`TallTableColumn::width`, `TallTableEvent::ColumnWidthsChanged`).
resize = []
# Rows, columns, or a block of cells selected by the pointer and the keys,
# as one range (`TallTableState::select`, `TallTableEvent::Selected`).
select = []
# A selection copied as TSV by Cmd+C, Ctrl+C, or `TallTableState::copy`,
# rows not loaded read beside the cache; the text goes to the host in
# pieces (`TallTableEvent::Copy`), which writes the clipboard.
copy = ["select"]
# The rows read in one column's order, ascending or descending, by a click
# on an arrow at a sortable header's right or `TallTableState::set_sort`;
# the source reads in it or refuses (`TallTableDelegate::sort`).
sort = []
# The first columns fixed at the left while the rest scroll sideways
# (`TallTableState::set_pinned`, `TallTableEvent::Pinned`); fewer pin
# while they'd take more than half the view.
pin = []
# A row height and a text size a host sets together, the table's other
# lengths following them (`TallTableState::set_density`, `Density`), and a
# column's width set without `resize` (`TallTableColumn::width`).
density = []
# A number column's shown text set by its host: fixed decimals (a page may
# answer a cell's own), a sign, grouping, a suffix; a text too wide for its
# cell shows the automatic format (`TallTableColumn::format`,
# `NumberFormat`, `TallTablePage::decimals`).
format = []
# The columns drawn in an order the table keeps, a column moved by a drag
# of its header or `TallTableState::move_columns`; the pages read by each
# column's index, so a move reads nothing (`TallTableState::order`,
# `TallTableEvent::ColumnsMoved`).
reorder = []
