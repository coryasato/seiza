[package]
name = "tall-table-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "What a seiza host does with the tall table's events: its marks, its scrollbar's targets, and its probes as JS values."

[dependencies]
# Marks and targets. A host names `seiza`'s features itself.
seiza.workspace = true
seiza-tall-table.workspace = true

[features]
# The drawn cells' paint in `js::cells`.
custom-cells = ["seiza-tall-table/custom-cells"]
# The refreshed mark and the generation drawn.
live = ["seiza-tall-table/live"]
# The tail mark (`TailDrawn`) and the following flag on a global.
follow = ["live", "seiza-tall-table/follow"]
# The widths a resize left (`ColumnWidthsChanged`), on a global.
resize = ["seiza-tall-table/resize"]
# The table's selection, forwarded for a host's build.
select = ["seiza-tall-table/select"]
# The clipboard's writer for the table's copies (`clipboard::Clipboard`),
# beside `Publish`, which drops the copy's events.
copy = ["select", "seiza-tall-table/copy"]
# The table's sort, forwarded for a host's build.
sort = ["seiza-tall-table/sort"]
# The table's pin, forwarded for a host's build.
pin = ["seiza-tall-table/pin"]

# The JS values are web-only; the crate compiles natively, as no-ops, for
# its hosts' clippy and tests.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
