[package]
name = "tall-table-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The tall table's bare host: the table alone, over rows answered from memory, where each feature's own cost is measured."

[lib]
crate-type = ["cdylib", "rlib"]

# One feature per table feature, each turning on the table's and the host's
# code that switches it on at run time (the table's PLAN.md, "Measuring a
# feature"). None on: the base.
[features]
# `?cells=heat|bars|color` paints every float column through its range.
custom-cells = ["seiza-tall-table/custom-cells", "tall-table-bridge/custom-cells"]
# `?live=<updates/s>` changes that many visible rows a second, seeded, and
# invalidates them; the rows' floats follow each row's version.
live = ["seiza-tall-table/live", "tall-table-bridge/live"]
# The tail feed: `?rows=<n>` rows at open, `?append=<rows/s>` more, a batch
# about every frame, and `?follow` following from the start.
follow = ["live", "seiza-tall-table/follow", "tall-table-bridge/follow"]
# Every column resizable (the table's default), so the bands draw and a
# drag or a double-click resizes.
resize = ["seiza-tall-table/resize", "tall-table-bridge/resize"]
# Every kind of selection on (the table's default), so a press, a drag, and
# the keys select.
select = ["seiza-tall-table/select", "tall-table-bridge/select"]
# The selection copied by Cmd+C and Ctrl+C (the table's keys, bound by its
# `init`), on `select`'s selection.
copy = ["select", "seiza-tall-table/copy", "tall-table-bridge/copy"]
# Every column sortable; the source sorts a column from memory, its order
# computed at its first sort and kept. `?sort-icons` draws gpui-kit's sort
# icons, which the host bundles, in place of the glyphs.
sort = ["seiza-tall-table/sort", "tall-table-bridge/sort"]

[dependencies]
gpui-kit.workspace = true
seiza-tall-table.workspace = true
# No engine: the rows come from memory, so the bytes and frame work are the
# table's alone. `just tall-table size` fails if one links.
tall-table-bridge.workspace = true

# The entry point is web-only; the view and the rows compile natively for
# clippy and tests.
[target.'cfg(target_family = "wasm")'.dependencies]
# Without the observation panel, as the observatory's GPUI contender builds
# it: the host carries nothing but the table.
seiza.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
# The rows' tests: GPUI's test app, a read's answer, and the sort fixture.
# Never in a build.
gpui-kit = { workspace = true, features = ["test-support"] }
futures = "0.3"
serde_json.workspace = true
