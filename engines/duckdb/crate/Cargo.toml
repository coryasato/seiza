[package]
name = "seiza-duckdb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DuckDB-Wasm for GPUI apps: the Rust client of the @seiza/duckdb bridge, and an Arrow IPC reader."

[features]
# A seiza-tall-table source: query results as pages, a registered Parquet file's
# rows and summary.
tall-table = ["dep:seiza-tall-table"]
# The view's sort (`view::ViewRows`' `TallTableDelegate::sort`): a sorted copy
# of the rows in view. Turns on the table's, whose delegate call it answers.
sort = ["tall-table", "seiza-tall-table/sort"]
# The view's find (`view::ViewRows`' `TallTableDelegate::find`): the rows in
# view searched in windows. Turns on the table's.
find = ["tall-table", "seiza-tall-table/find"]

[dependencies]
gpui-kit.workspace = true
seiza-tall-table = { workspace = true, optional = true }

# The client is web-only; the status, errors, and Arrow reader compile natively for tests.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["File", "Performance", "PerformanceEntry", "Window"] }

[dev-dependencies]
# Writes the Arrow IPC streams the reader's tests read back. Never in a build.
arrow = { version = "60", default-features = false, features = ["ipc"] }
# Reads the tall table's SQL fixture (`components/tall-table/fixtures/sql.json`).
serde_json.workspace = true
# The view's tests: GPUI's test app (a sort's preparation is a task), and a
# query's answer held back.
gpui-kit = { workspace = true, features = ["test-support"] }
futures = "0.3"
