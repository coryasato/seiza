[package]
name = "seiza-duckdb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DuckDB-Wasm for GPUI apps: the Rust client of the @seiza/duckdb bridge, and an Arrow IPC reader."

[features]
# A seiza-tall-table source: query results as pages, a registered Parquet file's
# rows and summary.
tall-table = ["dep:seiza-tall-table"]

[dependencies]
gpui-kit.workspace = true
seiza-tall-table = { workspace = true, optional = true }

# The client is web-only; the status, errors, and Arrow reader compile natively for tests.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["File", "Performance", "PerformanceEntry", "Window"] }

[dev-dependencies]
# Writes the Arrow IPC streams the reader's tests read back. Never in a build.
arrow = { version = "60", default-features = false, features = ["ipc"] }
