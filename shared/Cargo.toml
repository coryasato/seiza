[package]
name = "seiza"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "App-agnostic foundation for seiza apps: wasm bootstrap, app shell, first-frame mark."

[features]
default = ["panel"]
# The perf panel ("observation panel"), the frame sampler behind it, and the
# `perf` API. A host that shows only its own view (the observatory's GPUI
# contender) turns it off, and none of it links.
panel = []

[dependencies]
gpui-kit.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "DomTokenList", "Element", "Performance", "PerformanceEntry", "Location", "UrlSearchParams"] }
