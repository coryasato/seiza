# `trim-paths` is unstable on the pinned nightly; see [profile.release].
cargo-features = ["trim-paths"]

[workspace]
resolver = "3"
members = [
    "shared",
    "components/tall-table",
    "components/tall-table/bridge",
    "components/tall-table/host/crate",
    "engines/duckdb/crate",
    "apps/tycho/crate",
    "apps/observatory/contenders/tall-table/gpui/crate",
    # Throwaway: live tail's spike, deleted with apps/observatory/spike/.
    "apps/observatory/spike/tail-gpui",
    # Throwaway: the monitoring wall's spike, deleted with apps/observatory/spike/.
    "apps/observatory/spike/wall-gpui",
    "apps/kirkwood/crate",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Exact pin: every app shares one gpui-kit version. Bump deliberately, for all apps at once.
gpui-kit = "=0.9.1"
# Defaults off: a member that wants the panel names it (`features = ["panel"]`).
# Cargo ignores a member's `default-features = false` when this entry keeps them on.
seiza = { path = "shared", default-features = false }
seiza-duckdb = { path = "engines/duckdb/crate" }
seiza-tall-table = { path = "components/tall-table" }
tall-table-bridge = { path = "components/tall-table/bridge" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Tests only: the fixtures' JSON.
serde_json = "1"
web-sys = "0.3"

# Cargo reads this only from the workspace root, so it applies to every app.
# They were tuned by measurement (opt-level "z" vs "s").
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# Remap build paths in the compiled output (panic locations), so no wasm
# carries the builder's home directory and builds match across checkouts.
# docs/research/build-paths.md; root docs/DECISIONS.md, "Toolchain and build".
trim-paths = "object"

[profile.dev]
panic = "abort"
