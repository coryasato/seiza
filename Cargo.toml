[workspace]
resolver = "3"
members = [
    "shared",
    "components/tall-table",
    "components/tall-table/bridge",
    "components/tall-table/host/crate",
    "engines/duckdb/crate",
    "apps/tycho/crate",
    "apps/observatory/contenders/tall-table/gpui/crate",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Exact pin: every app shares one gpui-kit version. Bump deliberately, for all apps at once.
gpui-kit = "=0.8.0"
# Defaults off: a member that wants the panel names it (`features = ["panel"]`).
# Cargo ignores a member's `default-features = false` when this entry keeps them on.
seiza = { path = "shared", default-features = false }
seiza-duckdb = { path = "engines/duckdb/crate" }
seiza-tall-table = { path = "components/tall-table" }
tall-table-bridge = { path = "components/tall-table/bridge" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Tests only: the fixtures' JSON.
serde_json = "1"
web-sys = "0.3"

# Cargo reads this only from the workspace root, so it applies to every app.
# They were tuned by measurement (opt-level "z" vs "s").
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
