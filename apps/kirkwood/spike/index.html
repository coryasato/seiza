<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Kirkwood: the two canvases</title>
    <link rel="icon" href="data:," />
    <style>
      /* Two canvases, stacked: the scene's (Three.js) under GPUI's, which
         GPUI appends to <body> and which composites by its alpha
         (src/alpha.ts), so the scene shows wherever GPUI drew nothing. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #scene { z-index: 0; }
      body > canvas:not(#scene) { z-index: 1; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
