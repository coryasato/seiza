# Kirkwood's Worker: the app and its three files, at the root of its own
# hostname (docs/DECISIONS.md, "Hosting"). No account ID here (the repo is
# public): wrangler takes it from the login, or CLOUDFLARE_ACCOUNT_ID with an
# API token.
name = "kirkwood"
main = "src/index.ts"
compatibility_date = "2026-09-24"

# Served only from its custom domain, as Tycho's Worker is from its own. The
# old address, tycho.seiza.io/kirkwood and what's under it, is no route of
# this Worker's: the zone's redirect rule sends it here before any Worker
# runs (the gitignored root docs/private/zone.md). The account's default
# subdomain names its owner, so it's off and never committed (the root
# docs/DECISIONS.md, "Hosting"), and so are preview URLs, which live on it.
routes = [{ pattern = "kirkwood.seiza.io", custom_domain = true }]
workers_dev = false
preview_urls = false

# The release build (`just kirkwood build`), at the hostname's root: the
# Worker runs first for every request and serves the quality-11 `.br`
# written beside each file (scripts/stage.ts). No page is found for it
# (`html_handling`), and a path no file matches is the Worker's 404.
# `wrangler dev` needs the directory to exist: run
# `just kirkwood build` first (scripts/dev.ts says so).
[assets]
directory = "../web/dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

# The three files, each as it is and at brotli 11 (`<name>.br`). In
# `wrangler dev` (local mode) this is Miniflare's R2, stored under
# .wrangler/state/ and filled by scripts/dev.ts.
[[r2_buckets]]
binding = "KIRKWOOD_DATA"
bucket_name = "kirkwood-data"

[dev]
port = 8788

[observability]
enabled = true
