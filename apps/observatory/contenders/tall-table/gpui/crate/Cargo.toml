[package]
name = "tall-table-gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The observatory's GPUI contender: seiza-tall-table over seiza-duckdb in a bare host."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit.workspace = true
seiza-duckdb = { workspace = true, features = ["tall-table"] }
seiza-tall-table.workspace = true

[dev-dependencies]
# The feed fixture's JSON (`src/market.rs`), and GPUI's test app for the
# market source's tests (`src/scene/market.rs`). Never in a build.
serde_json.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

# The entry point and the contract are web-only; the view compiles natively for clippy.
[target.'cfg(target_family = "wasm")'.dependencies]
# Without the observation panel: the contender carries no chrome the DOM side
# lacks (root CLAUDE.md, "Comparison protocol"). `just observatory sizes`
# fails if it links anyway.
seiza.workspace = true
# What the contender does with the table's events: its mark, targets, probes.
tall-table-bridge.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
# Live tail's file fetched whole, handed to the engine as a `File`: the
# tail level's alone (optional), so the other levels' builds are as before.
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["File"], optional = true }

# The base level's own: the admin table's fonts toggle (`src/fonts.rs`),
# `seiza`'s `canvas-font-fallback` for Han and Hangul drawn by the browser.
# The base build turns it on (the recipes, `contenders/level.ts`'s
# `gpuiCargoFeatures`); no other level's build carries it.
# A feature level is a build of its own (`contenders/scenarios.ts`,
# `LEVEL_FEATURES`): built alone (`-p`), at a base of its own. Off, the
# build is the base level's and carries none of it.
[features]
fonts = ["seiza/canvas-font-fallback"]
# The wide sheet's level: heat on the days (`custom-cells`), the key
# columns pinned (`pin`), the stop's rows, text, and widths (`density`),
# every column resizable (`resize`), every kind of selection (`select`),
# and the selection copied (`copy`, the bridge's clipboard writer;
# `src/wide.rs`).
wide = [
    "seiza-tall-table/custom-cells",
    "seiza-tall-table/pin",
    "seiza-tall-table/density",
    "seiza-tall-table/resize",
    "seiza-tall-table/select",
    "seiza-tall-table/copy",
    "tall-table-bridge/custom-cells",
    "tall-table-bridge/pin",
    "tall-table-bridge/density",
    "tall-table-bridge/resize",
    "tall-table-bridge/select",
    "tall-table-bridge/copy",
]
# Market watch's level: the changed cells' flash (`custom-cells` with
# `live`), the rows re-read in place (`live`), and the canvas's text
# (`format`), and its store (`src/market.rs`), which the feed fixture runs
# natively. The host's scene for it comes with the level's build.
market = [
    "seiza-tall-table/custom-cells",
    "seiza-tall-table/live",
    "seiza-tall-table/format",
    "tall-table-bridge/custom-cells",
    "tall-table-bridge/live",
    "tall-table-bridge/format",
]
# Live tail's level: the view following the tail as the clock grows the
# rows (`follow`, with its `live`), the time muted and an error status in
# the fall's color (`custom-cells`), the bytes grouped (`format`), and the
# canvas's column widths (`density`, at the base's rows and text); the
# replay's page SQL over the looping file and the time's text
# (`src/tail.rs`), which the tall table's fixtures run natively.
tail = [
    "seiza-tall-table/custom-cells",
    "seiza-tall-table/follow",
    "seiza-tall-table/format",
    "seiza-tall-table/density",
    "tall-table-bridge/custom-cells",
    "tall-table-bridge/follow",
    "tall-table-bridge/format",
    "tall-table-bridge/density",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# The monitoring wall's level: market watch's features (the flash, the rows
# re-read in place, the canvas's text) and `density` (the canvas's 24 px
# rows, 12 px text, and column widths), with market watch's store and feed
# (`src/market.rs`, `src/feed.rs`) over N tables (`src/wall.rs`, the
# host in the bare host's place; `src/scene/wall.rs`, its source).
wall = [
    "seiza-tall-table/custom-cells",
    "seiza-tall-table/live",
    "seiza-tall-table/format",
    "seiza-tall-table/density",
    "tall-table-bridge/custom-cells",
    "tall-table-bridge/live",
    "tall-table-bridge/format",
    "tall-table-bridge/density",
]
