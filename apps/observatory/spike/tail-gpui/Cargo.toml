[package]
name = "tail-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Throwaway: live tail's GPUI spike (the tall table built `follow` over the NASA logs' file through DuckDB-Wasm, looping, under a clock worker). Deleted with the spike."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit.workspace = true
seiza-duckdb = { workspace = true, features = ["tall-table"] }
seiza-tall-table = { workspace = true, features = ["follow"] }

[target.'cfg(target_family = "wasm")'.dependencies]
seiza.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["File"] }
