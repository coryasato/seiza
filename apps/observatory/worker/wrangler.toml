# The Observatory's Worker: static assets, and a script (src/index.ts) that
# runs first for every request: it serves the builds precompressed and the
# data by range, which static assets can't. No account ID here (the repo is public): wrangler
# takes it from the login, or CLOUDFLARE_ACCOUNT_ID with an API token.
name = "observatory"
main = "src/index.ts"
compatibility_date = "2026-10-13"

# The apex, a Workers custom domain on the seiza.io zone; everything it
# serves is under /observatory/ (CLAUDE.md, rule 2), and any other path is a
# 404. The account's default subdomain names its owner, so it's off and
# never committed, and so are preview URLs, which live on it.
routes = [{ pattern = "seiza.io", custom_domain = true }]
workers_dev = false
preview_urls = false

# Staged by scripts/stage.ts (`just observatory deploy`): the page, both
# contenders at their bases, the engine, the data at observatory/data/, and
# the font at fonts/, with a quality-11 `.br` beside each build file and a
# `.gz` beside each one over the 25 MiB asset limit (DuckDB's wasm bundles,
# which .assetsignore leaves out). The script runs first for everything and
# reads the files through the binding; `html_handling = "none"`, because it
# maps a route to its index.html itself (the assets' default redirects
# index.html to its directory). DATA_SHA256 (the file's version, the edge
# cache's key) is passed by the deploy from data/MANIFEST.json, never
# committed here.
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = true

[observability]
enabled = true
