<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tycho</title>
    <!-- No favicon yet; an empty one saves a 404 on every load. -->
    <link rel="icon" href="data:," />
    <meta name="description" content="A local-first data workbench. Drop a CSV or Parquet file and scroll every row. Nothing is uploaded." />
    <!-- The theme before the page paints: the system's, until the visitor
         picks one (src/frame/core.ts). The token file keys on it. -->
    <script>
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <noscript>Tycho needs JavaScript and WebAssembly.</noscript>
    <!-- The frame, prerendered (src/frame/prerender.tsx). -->
    <div id="root"></div>
    <!-- Where the canvas goes: the table, and only the table. -->
    <div id="table-slot"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
