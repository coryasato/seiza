[package]
name = "tycho"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit.workspace = true
# The observation panel (`seiza::perf`), named so Tycho never depends on
# `seiza`'s defaults.
seiza = { workspace = true, features = ["panel"] }
seiza-duckdb = { workspace = true, features = ["tall-table"] }
# The table's features Tycho adopts, each through the controller (`view.rs`).
seiza-tall-table = { workspace = true, features = [
    "resize",
    "reorder",
    "pin",
    "format",
    "select",
    "copy",
    "clicks",
    "hide",
    "popover",
    "header-icon",
] }
# What Tycho does with the table's events: its marks, targets, and probes.
tall-table-bridge = { workspace = true, features = [
    "resize",
    "reorder",
    "pin",
    "format",
    "select",
    "copy",
    "clicks",
    "hide",
    "popover",
    "header-icon",
] }
# The view state's serialized form (`view.rs`), already in the wasm through
# gpui and the engine.
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

# The entry point and the bootstrap are web-only; the views compile natively for clippy and tests.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# `join`, for the CSV ingest (already in the lock through gpui).
futures = { version = "0.3", default-features = false, features = ["std"] }
web-sys = { workspace = true, features = [
    "Blob",
    "File",
    "Response",
    "Window",
] }

[dev-dependencies]
# The controller's tests drive a table in GPUI's test app (`view.rs`).
gpui-kit = { workspace = true, features = ["test-support"] }
# Writes the Arrow IPC streams the reader's tests read back. Never in the app.
arrow = { version = "60", default-features = false, features = ["ipc"] }
