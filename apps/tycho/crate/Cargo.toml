[package]
name = "tycho"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit.workspace = true

# The entry point and the bootstrap are web-only; the views compile natively for clippy and tests.
[target.'cfg(target_family = "wasm")'.dependencies]
seiza.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["File", "Location", "Performance", "PerformanceEntry", "UrlSearchParams", "Window"] }

[dev-dependencies]
# Writes the Arrow IPC streams the reader's tests read back. Never in the app.
arrow = { version = "60", default-features = false, features = ["ipc"] }
